
<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Aluminum Phularwan</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef2f5;margin:0;padding:12px;color:#17212b}
header{background:#123d50;color:white;padding:18px;border-radius:12px;text-align:center}
h2{font-size:19px}
h3{background:#dce8ed;padding:10px;border-radius:7px}
.box{background:white;padding:13px;margin-top:12px;border-radius:10px}
label{display:block;font-size:14px;margin:10px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #bbc8ce;border-radius:7px;font-size:16px}
button{padding:12px;border:0;border-radius:8px;background:#14566b;color:white;font-size:15px;margin:5px 2px}
.green{background:#16834d}
.orange{background:#b76b13}
.red{background:#b83232}
.window{border:1px solid #ccd7dc;padding:12px;border-radius:9px;margin:12px 0}
.result{background:#e7f4eb;padding:13px;border-radius:9px;line-height:2}
.total{font-size:23px;font-weight:bold;color:#12613b}
small{color:#58666d}
</style>
</head>
<body>
<header>
<h2>Prime Aluminum & Glass</h2>
Phularwan
<div>بسم اللہ الرحمن الرحیم</div>
</header>

<div class="box">
<h3>Customer Information / کسٹمر کی معلومات</h3>
<label>Customer Name</label>
<input id="customer" placeholder="کسٹمر کا نام">
<label>Mobile Number</label>
<input id="mobile" placeholder="موبائل نمبر">
<label>Date</label>
<input id="date" type="date">
</div>

<div class="box">
<h3>Window Estimate / ونڈو کا حساب</h3>
<div id="windows"></div>
<button onclick="addWindow()">+ نئی Window شامل کریں</button>
</div>

<div class="box">
<h3>Rates / ریٹس</h3>
<label>Aluminium Rate (فی مربع فٹ)</label>
<input id="alRate" type="number" value="0">
<label>Glass Rate (فی مربع فٹ)</label>
<input id="glassRate" type="number" value="0">
<label>Hardware Rate (فی ونڈو)</label>
<input id="hardwareRate" type="number" value="0">
<label>Labour Rate (فی مربع فٹ)</label>
<input id="labourRate" type="number" value="0">
<label>Aluminium Discount (%)</label>
<input id="discount" type="number" value="0">
</div>

<div class="box">
<h3>Georgian Bar / جورجین بار</h3>
<label><input id="georgian" type="checkbox" style="width:auto"> Georgian Bar شامل کریں</label>
<label>Georgian Bar Rate (فی مربع فٹ)</label>
<input id="georgianRate" type="number" value="0">
</div>

<div class="box">
<h3>Other Charges / دیگر اخراجات</h3>
<label>Carriage / کرایہ</label>
<input id="carriage" type="number" value="0">
<label>Shower Cabin Extra Charges</label>
<input id="showerExtra" type="number" value="0">
</div>

<div class="box">
<button class="green" onclick="calculate()">Calculate Estimate / حساب کریں</button>
<div class="result" id="result">ابھی Estimate نہیں بنایا گیا۔</div>
<label>Final Deal Price / طے شدہ قیمت</label>
<input id="finalPrice" type="number" placeholder="خالی چھوڑیں تو اصل قیمت استعمال ہوگی">
<label>Advance / ایڈوانس</label>
<input id="advance" type="number" value="0">
<div id="balance"></div>
</div>

<div class="box">
<button class="green" onclick="saveEstimate()">Save Estimate</button>
<button onclick="shareEstimate()">Share / PDF</button>
<button class="orange" onclick="newEstimate()">New Estimate</button>
</div>

<div class="box">
<h3>Saved Customers / محفوظ Estimate</h3>
<input id="search" placeholder="نام یا موبائل سے تلاش کریں" oninput="showSaved()">
<div id="saved"></div>
</div>

<script>
let lastTotal=0;
let savedData=[];

document.getElementById('date').valueAsDate=new Date();

function addWindow(){
let div=document.createElement('div');
div.className='window';
div.innerHTML=`
<h3>Window Details</h3>
<label>Window Type</label>
<select class="type">
<option>Fixed Window</option>
<option>Sliding Window</option>
<option>Openable Window</option>
<option>Shower Cabin</option>
</select>
<label>Section</label>
<select class="section">
<option>DC26F</option><option>DC30F</option>
<option>M23</option><option>M28</option>
<option>M24</option><option>D29</option>
<option>D54F</option><option>D50A</option>
<option>Other</option>
</select>
<label>Width (Inches)</label>
<input class="width" type="number" value="0">
<label>Height (Inches)</label>
<input class="height" type="number" value="0">
<label>Quantity / تعداد</label>
<input class="qty" type="number" value="1">
<button class="red" onclick="this.parentElement.remove()">Remove Window</button>
`;
document.getElementById('windows').appendChild(div);
}
addWindow();

function calculate(){
let area=0,hardware=0,details='';
document.querySelectorAll('.window').forEach((w,i)=>{
let width=+w.querySelector('.width').value;
let height=+w.querySelector('.height').value;
let qty=+w.querySelector('.qty').value;
let sqft=(width/12)*(height/12)*qty;
area+=sqft;
hardware+=qty;
details+=`<br>Window ${i+1}: ${sqft.toFixed(2)} Sq Ft`;
});
let al=area*(+alRate.value);
let disc=al*(+discount.value)/100;
let aluminium=al-disc;
let glass=area*(+glassRate.value);
let hw=hardware*(+hardwareRate.value);
let labour=area*(+labourRate.value);
let gb=georgian.checked?area*(+georgianRate.value):0;
let carriage=+document.getElementById('carriage').value;
let shower=+document.getElementById('showerExtra').value;
lastTotal=aluminium+glass+hw+labour+gb+carriage+shower;
let html=`
<strong>Total Area:</strong> ${area.toFixed(2)} Sq Ft
${details}
<hr>
Aluminium: Rs. ${aluminium.toFixed(0)}<br>
Glass: Rs. ${glass.toFixed(0)}<br>
Hardware: Rs. ${hw.toFixed(0)}<br>
Labour: Rs. ${labour.toFixed(0)}<br>
Georgian Bar: Rs. ${gb.toFixed(0)}<br>
Carriage: Rs. ${carriage}<br>
Shower Extra: Rs. ${shower}<br>
<hr><div class="total">Grand Total: Rs. ${lastTotal.toFixed(0)}</div>
`;
document.getElementById('result').innerHTML=html;
updateBalance();
return html;
}

function updateBalance(){
let price=+document.getElementById('finalPrice').value||lastTotal;
let advance=+document.getElementById('advance').value;
document.getElementById('balance').innerHTML=
`<strong>Final Price:</strong> Rs. ${price}<br>
<strong>Advance:</strong> Rs. ${advance}<br>
<strong>Remaining:</strong> Rs. ${price-advance}`;
}
document.getElementById('finalPrice').addEventListener('input',updateBalance);
document.getElementById('advance').addEventListener('input',updateBalance);

function getRecord(){
return {
customer:customer.value,mobile:mobile.value,date:date.value,
result:result.innerHTML,
finalPrice:+finalPrice.value||lastTotal,
advance:+advance.value
};
}
function saveEstimate(){
if(!lastTotal){alert('پہلے Calculate کریں');return}
savedData=JSON.parse(localStorage.getItem('primeEstimates')||'[]');
savedData.unshift(getRecord());
localStorage.setItem('primeEstimates',JSON.stringify(savedData));
alert('Estimate محفوظ ہوگیا');
showSaved();
}
function showSaved(){
savedData=JSON.parse(localStorage.getItem('primeEstimates')||'[]');
let q=search.value.toLowerCase();
saved.innerHTML='';
savedData.forEach((r,i)=>{
if((r.customer||'').toLowerCase().includes(q)||(r.mobile||'').includes(q)){
let b=document.createElement('button');
b.textContent=(r.customer||'Customer')+' - '+r.date;
b.onclick=()=>loadRecord(i);
saved.appendChild(b);
}
});
}
function loadRecord(i){
let r=savedData[i];
customer.value=r.customer;mobile.value=r.mobile;date.value=r.date;
result.innerHTML=r.result;
lastTotal=r.finalPrice;
finalPrice.value=r.finalPrice;advance.value=r.advance;
updateBalance();
}
function shareEstimate(){
if(!lastTotal){alert('پہلے Calculate کریں');return}
window.print();
}
function newEstimate(){
if(confirm('نیا Estimate شروع کریں؟')){
document.querySelectorAll('input').forEach(x=>{
if(x.type==='checkbox')x.checked=false;
else if(x.type!=='date' && x.id!=='alRate' && x.id!=='glassRate' && x.id!=='hardwareRate' && x.id!=='labourRate' && x.id!=='discount' && x.id!=='georgianRate' && x.id!=='carriage' && x.id!=='showerExtra')x.value='';
});
document.getElementById('windows').innerHTML='';
addWindow();
result.innerHTML='ابھی Estimate نہیں بنایا گیا۔';
lastTotal=0;
}
}
showSaved();
</script>
</body>
</html>
